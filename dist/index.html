<meta property="og:description" content="궤도에 오르기까지, 일곱 개의 기록 / dcamp batch 4 7개사 원페이저">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b1615'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23c8db99'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"SUITM";src:url(assets/suit.7151b6fe.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"ChivoMonoM";src:url(assets/mono.c00775f8.woff2) format("woff2");font-weight:100 900;font-display:swap}
/*
  d.day one-pager / mobile web
  키오스크(1080x1920 고정 스테이지) 디자인 토큰을 그대로 쓰고, 레이아웃만 유동형(360~480px 컬럼)으로 다시 짠 버전.
*/
:root{
  --bg:#1b1615; --raise:#241e1d; --press:#2e2726; --bubble:#2c2524;
  --line:#3c3838; --line2:#5e5a58; --rule:#72706f;
  --text:#ffffff; --body:#d9d3ce; --sub:#a39d98; --dim:#77716d;
  --lime:#c8db99; --lime-ink:#1b1615;
  --sans:"SUITM",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"ChivoMonoM",ui-monospace,Menlo,monospace;
  --ls-display:-0.035em; --ls-head:-0.025em; --ls-body:-0.01em;
  --lh-display:1.12; --lh-head:1.36; --lh-body:1.7;
  --gut:20px; --col:480px;
  --sl:max(var(--gut),env(safe-area-inset-left)); --sr:max(var(--gut),env(safe-area-inset-right));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;border-radius:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;letter-spacing:var(--ls-body);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;overflow-x:hidden}
img{display:block;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:left}
a{color:inherit;text-decoration:none}
b{font-weight:700}
svg{display:block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.mono{font-family:var(--mono);letter-spacing:0}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes fi{from{opacity:0}to{opacity:1}}

#app{position:relative;width:100%;max-width:var(--col);margin:0 auto}
.screen{display:none}
.screen.on{display:block;animation:fi .3s ease both}
#detail.on{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

/* 타이틀바 (sticky) */
.bar{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:10px;padding:0 var(--sr) 0 var(--sl);border-bottom:1.5px solid var(--rule);background:var(--bg);color:var(--sub)}
.bar .ico{flex:none;display:flex;gap:10px;color:var(--dim)}
.bar .ico svg{width:18px;height:18px}
.bar .t{flex:1 1 auto;min-width:0;font-family:var(--mono);font-size:13px;font-weight:600;color:#bdb7b2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.bar .t .ko{font-family:var(--sans);font-weight:700;color:#fff;letter-spacing:var(--ls-head);margin:0 3px}
.bar .r{flex:none;margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--dim);letter-spacing:0}
#detail .bar:after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;background:linear-gradient(180deg,var(--bg),rgba(27,22,21,0));pointer-events:none}
@media (max-width:439px){#detail .bar .ico{display:none}}

/* ============ HOME ============ */
#cv,.wash{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--col);height:100vh;height:100lvh;pointer-events:none}
#cv{z-index:0}
.wash{z-index:0;background:linear-gradient(90deg,rgba(27,22,21,.86) 0%,rgba(27,22,21,.5) 55%,rgba(27,22,21,.2) 100%)}
.hz{position:relative;z-index:1}
.hero{padding:30px var(--sr) 30px var(--sl)}
.hero .k{font-family:var(--mono);font-size:13px;font-weight:600;color:#fff;letter-spacing:0}
.hero .lead{margin-top:18px;font-size:clamp(34px,9.6vw,38px);font-weight:700;line-height:1.18;letter-spacing:-0.045em}
.hero .lead .hl{color:var(--lime)}
.hero .st{margin-top:16px;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--sub);line-height:1.6;letter-spacing:0}
.hero .st i{display:inline-block;width:8px;height:8px;background:#fff;border-radius:50%;margin-right:8px;vertical-align:1px}

.list{border-top:1.5px solid var(--rule)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:92px;padding:16px var(--sr) 16px var(--sl);border-bottom:1.5px solid var(--line);background:rgba(27,22,21,.8);transition:background .12s}
.row:active{background:rgba(46,39,38,.92)}
.row .n{flex:none;width:38px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--sub);letter-spacing:0}
.row .tx{flex:1;min-width:0}
.row .lgw{display:flex;align-items:center;height:26px}
.row .lg{width:auto;max-width:72%;object-fit:contain;object-position:left center}
.row .qq{display:block;margin-top:8px;font-size:17px;font-weight:600;line-height:1.4;letter-spacing:var(--ls-head);text-wrap:balance}
.row .go{flex:none;width:20px;height:20px;color:var(--sub)}

.composer{display:flex;align-items:center;gap:12px;width:auto;margin:26px var(--sr) 0 var(--sl);min-height:56px;padding:10px 16px;border:1.5px dashed var(--line2);background:rgba(27,22,21,.74)}
.composer .ph{flex:1;min-width:0;font-size:15px;line-height:1.5;color:var(--sub)}
.composer .ret{flex:none;width:22px;height:22px;color:var(--sub)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 12px;margin-top:30px;padding:0 var(--sr) calc(28px + env(safe-area-inset-bottom)) var(--sl);font-family:var(--mono);font-size:12px;font-weight:500;color:var(--dim);line-height:1.5;letter-spacing:0}
.foot > span{background:rgba(27,22,21,.85);padding:2px 6px}
.foot i{display:inline-block;width:7px;height:7px;background:#fff;border-radius:50%;margin-right:7px;vertical-align:1px}

/* ============ DETAIL (대화) ============ */
#panel{flex:1 0 auto;padding:30px var(--sr) 0 var(--sl)}
.d-logo{width:auto;max-width:78%;object-fit:contain;object-position:left center}
.d-q{margin-top:22px;font-size:clamp(20px,5.6vw,22px);font-weight:800;line-height:1.45;letter-spacing:-0.03em;color:var(--lime);text-wrap:balance}
.d-q .tw{color:transparent}
.d-q .cur{position:relative}
.d-q .cur:after{content:"";position:absolute;left:2px;bottom:-.08em;width:.5em;height:3px;background:var(--lime);animation:blink 1s steps(1) infinite}
.rv{opacity:0;transform:translateY(12px);transition:opacity .55s ease,transform .55s ease}
.rv.on{opacity:1;transform:none}
.d-p{margin-top:18px;font-size:16px;font-weight:400;line-height:var(--lh-body);color:var(--body)}
.d-core{margin-top:26px;padding-top:14px;border-top:1.5px solid var(--line);display:flex;gap:12px;font-size:14px;line-height:1.6;color:var(--sub)}
.d-core .mono{flex:none;font-size:12px;font-weight:600;color:var(--lime);padding-top:2px}

.turn{margin-top:48px}
.ask{display:flex;justify-content:flex-end}
.ask div{max-width:86%;background:var(--bubble);padding:12px 16px;font-size:16px;font-weight:500;line-height:1.5}
.turn .ask{animation:up .4s ease both}
.turn .ans{margin-top:26px;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.typing{margin-top:26px;display:flex;gap:7px}
.typing i{width:8px;height:8px;background:var(--sub);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}

.next{margin-top:44px}
.ghost{display:flex;justify-content:flex-end}
.next.dup .ghost{visibility:hidden}
.nb{white-space:nowrap}
.ghost button{max-width:88%;display:flex;align-items:center;gap:14px;border:1.5px solid var(--rule);padding:13px 14px 13px 18px;font-size:16px;font-weight:500;line-height:1.5;color:var(--text);transition:background .12s;animation:breathe 2.4s ease-in-out infinite}
.ghost button:active{background:var(--press)}
.ghost button svg{flex:none;width:24px;height:24px;color:var(--lime);animation:press 2.4s ease-in-out infinite}
.ghost small{display:block;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--lime);margin-bottom:3px;letter-spacing:0}
.ghost em{display:block;font-style:normal;text-wrap:balance}
@keyframes breathe{0%,100%{border-color:var(--rule)}50%{border-color:var(--lime);box-shadow:0 0 0 3px rgba(200,219,153,.08)}}
@keyframes press{0%,60%,100%{transform:none}75%{transform:translate(-3px,2px) scale(.92)}}

.who{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--lime);letter-spacing:0}
.h{margin-top:10px;font-size:clamp(22px,6.2vw,24px);font-weight:600;line-height:var(--lh-head);letter-spacing:var(--ls-head)}
.h.s{font-size:20px;margin-top:30px}
.h,.mentor .q,.step .st{text-wrap:balance}
.p,.d-p,.lst li,.step .sb,.stat .l,.note,.mentor li,.ask div,.tgt .td{text-wrap:pretty}
.p{margin-top:16px;font-size:16px;line-height:var(--lh-body);color:var(--body)}
.p b{color:#fff;font-weight:600}
.note{margin-top:12px;font-size:16px;line-height:1.6;color:var(--sub)}
.note b{color:var(--body);font-weight:600}
.subh{margin-top:30px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--sub);letter-spacing:0}
.lst{list-style:none;margin-top:12px;border-top:1.5px solid var(--line)}
.lst li{display:flex;gap:12px;padding:14px 0;border-bottom:1.5px solid var(--line);font-size:16px;line-height:1.6;color:var(--body)}
.lst li b{color:#fff;font-weight:600}
.lst li .m{flex:none;width:24px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--lime);padding-top:4px;letter-spacing:0}
.tgts{margin-top:20px;border-top:1.5px solid var(--rule)}
.tgt{padding:18px 0 20px;border-bottom:1.5px solid var(--line)}
.tgt .tn{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--lime);letter-spacing:0}
.tgt .tk{margin-top:8px;font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-0.035em;text-wrap:balance}
.tgt .tt{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.tgt .tt span{font-size:13px;font-weight:600;color:var(--body);background:var(--bubble);padding:3px 8px}
.tgt .td{margin-top:10px;font-size:15px;line-height:1.6;color:var(--sub)}
.stats{margin-top:20px;border-top:1.5px solid var(--rule)}
.stat{padding:18px 0 18px;border-bottom:1.5px solid var(--line)}
.stat .v{font-size:34px;font-weight:700;letter-spacing:-0.04em;line-height:1.15}
.stat .v .num{color:var(--lime)}
.stat .l{margin-top:8px;font-size:15px;line-height:1.6;color:var(--sub)}
.stat .l b{color:var(--body);font-weight:600}
.stat .bt{font-size:16px;font-weight:600}
.stat ul{list-style:none;margin-top:6px}
.stat li{font-size:15px;line-height:1.55;color:var(--sub);padding:3px 0}
.steps{margin-top:20px;border-top:1.5px solid var(--rule)}
.step{display:flex;gap:12px;padding:18px 0;border-bottom:1.5px solid var(--line)}
.step .sn{flex:none;width:58px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--lime);padding-top:4px;letter-spacing:0}
.step > div{min-width:0}
.step .st{font-size:18px;font-weight:600;line-height:1.42;letter-spacing:var(--ls-head)}
.step .sb{margin-top:6px;font-size:16px;line-height:1.7;color:var(--body)}
.mentor{margin-top:20px;border-top:1.5px solid var(--rule);padding-top:20px}
.mentor + .mentor{margin-top:30px}
.mentor .mh{display:flex;gap:16px;align-items:flex-end}
.mentor .ph{flex:none;width:88px;height:88px;overflow:hidden;background:#ccc}
.mentor .ph img{width:100%;height:100%;object-fit:cover}
.mentor .mn{font-size:26px;font-weight:700;letter-spacing:-0.03em;line-height:1.2}
.mentor .mr{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--sub);margin-top:4px;letter-spacing:0}
.mentor .q{margin-top:18px;font-size:19px;font-weight:600;line-height:1.45;letter-spacing:var(--ls-head)}
.mentor ul{list-style:none;margin-top:10px}
.mentor li{display:flex;gap:10px;font-size:15px;line-height:1.6;color:var(--body);padding:4px 0}
.mentor li span{flex:none;width:22px;font-weight:600;color:var(--sub)}

/* 본문 끝: 연락처 > 목록으로 > 서명 */
.dbox{margin-top:40px;min-height:56px;border-top:1.5px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:4px 22px}
.dbox .ph{font-family:var(--mono);font-size:12px;font-weight:600;color:#7f7975;margin-right:auto;letter-spacing:0}
.act{min-height:48px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:#fff}
.act:active{color:var(--lime)}
.act svg{width:20px;height:20px}
.act.hide{display:none}
.dnav{margin-top:6px}
.dnav .all{width:100%;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bubble);color:#fff;font-size:16px;font-weight:600}
.dnav .all:active{background:#3a3231}
.dnav .all svg{width:22px;height:22px;color:var(--lime)}
.sig{margin-top:40px;padding-bottom:28px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 16px}
.sig .k{font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;letter-spacing:0}
.sig .w{margin-top:8px;color:var(--lime);line-height:0}
.sig .w .wm{width:150px;height:auto;display:block}
.sig .r{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--sub);line-height:1.6;text-align:right;letter-spacing:0}
.sig .r i{display:inline-block;width:7px;height:7px;background:#fff;border-radius:50%;margin-right:7px;vertical-align:1px}

/* 하단 고정: 다음 질문 바 + 키워드 탭 */
.dock{position:sticky;bottom:0;z-index:20;background:var(--bg)}
.chips{display:flex;height:calc(50px + env(safe-area-inset-bottom));padding:0 max(4px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-left));background:var(--raise);border-top:1.5px solid var(--line)}
.chip{position:relative;flex:1 1 auto;height:50px;word-spacing:-.3em;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:0;color:#8a847f;white-space:nowrap;transition:color .15s,background .15s}
.chip:after{content:"";position:absolute;left:50%;bottom:8px;width:0;height:2px;background:var(--lime);transition:width .2s,left .2s}
.chip:active{color:var(--body);background:var(--press)}
.chip.on{color:var(--lime)}
.chip.on:after{left:calc(50% - 14px);width:28px}
.nbar{position:absolute;left:var(--sl);right:var(--sr);bottom:calc(100% + 10px);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px 10px 16px;background:var(--bg);border:1.5px solid var(--lime);box-shadow:0 -16px 22px 6px var(--bg);color:var(--text);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .25s,transform .25s,visibility 0s linear .25s}
.nbar.on{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s}
.nbar:active{background:var(--press)}
.nbar > span{min-width:0}
.nbar small{display:block;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--lime);letter-spacing:0}
.nbar em{display:block;font-style:normal;font-size:16px;font-weight:500;line-height:1.4;margin-top:2px;text-wrap:balance}
.nbar svg{flex:none;width:22px;height:22px;color:var(--lime);animation:press 2.4s ease-in-out infinite}

.toast{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));z-index:40;max-width:calc(100% - 40px);transform:translate(-50%,16px);background:#fff;color:var(--bg);padding:13px 20px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .screen.on,.turn .ask,.turn .ans,.ghost button,.ghost button svg,.nbar svg,.typing i,.blink,.d-q .cur:after{animation:none}
  .rv{transition:none}
}
</style>
</head>

<div id="app">
  <!-- HOME -->
  <section id="home" class="screen">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="wash" aria-hidden="true"></div>
    <header class="bar">
      <span class="ico" aria-hidden="true"><svg><use href="#i-menu"/></svg><svg><use href="#i-side"/></svg></span>
      <span class="t">paths_to_orbit.md</span>
      <span class="r" id="hBarR"></span>
    </header>
    <div class="hz">
      <div class="hero">
        <div class="k" id="hK"></div>
        <h1 class="lead" id="hLead"></h1>
        <div class="st"><i></i><span id="hSt"></span><span class="blink">_</span></div>
      </div>
      <nav class="list" id="list"></nav>
      <button type="button" class="composer" id="composer">
        <span class="ph">궁금한 질문을 눌러 대화를 시작하세요</span>
        <svg class="ret" aria-hidden="true"><use href="#i-ret"/></svg>
      </button>
      <footer class="foot"><span><i></i><span id="fL"></span></span><span id="fR"></span></footer>
    </div>
  </section>

  <!-- DETAIL -->

서 설계 변경과 검토가 반복되고, 중소기업은 소수의 엔지니어가 제품 설계부터 검증까지 전담합니다."},{"t":"p","html":"어느 쪽이든 설계·해석·검증의 반복 작업은 <b>숙련 엔지니어 개인에게 몰리고,</b> 그 결과 리드타임이 길어지고 품질 편차가 커집니다. 개인에게 축적된 핵심 노하우는 조직의 자산으로 남기 어렵습니다."}]},{"key":"who","ko":"타깃","en":"WHO","label":"핵심 타깃","title":"","blocks":[{"t":"targets","items":[{"k":"모빌리티·로봇 기업","tags":null,"d":"기계 시스템을 반복적으로 설계하는 모빌리티 OEM, Tier 1·2 부품사, 로봇·자동화 기업"},{"k":"정밀부품·항공·방산 기업","tags":null,"d":"반도체·자동화 설비 및 정밀부품 기업, 항공·방산·전자 기업 및 연구기관"}]}]},{"key":"market","ko":"시장","en":"MARKET","label":"시장 규모","title":"설계 인력 부족과 AI 도입 확산으로 커지는 글로벌 기계·제조 설계 소프트웨어 시장","blocks":[{"t":"stats","items":[{"value":"약 50조 원","label":"<b>TAM</b> · 2030년 글로벌 설계 SW 시장 기준"},{"value":"약 1조 원","label":"<b>SAM</b> · 아이디어오션의 잠재고객 14.1만 개사가 연간 설계 SW에 지출하는 규모"}]},{"t":"sub","text":"MARKET PROOF"},{"t":"list","items":["국내 완성차 OEM을 포함한 제조 대기업과 유상 프로젝트 및 PoC 진행, 실제 설계 현장에서 제품·시장 적합성 검증","대기업 고객 대상 사내 보안 환경과 기존 CAD Workflow에 맞춘 온프레미스 형태 제공","2026년 9~10월 METHEUS 클라우드 오픈베타 시작, 글로벌 사용자층으로 제품 검증 확대 예정","온프레미스·클라우드 서비스 병행으로 고객 환경에 맞는 형태로 확장"]}]},{"key":"goal","ko":"지향점","en":"GOAL","label":"지향점","title":"누구나 아이디어만으로 실제 제작 가능한 기계를 설계하는 세상","blocks":[{"t":"p","html":"<b>METHEUS는 기존 CAD를 대체하지 않습니다.</b> 어느 LLM에서 작업을 시작하더라도 전문적인 기계설계 요청은 METHEUS가 수행하고, 그 결과가 고객의 CAD·CAE 환경으로 이어지는 구조를 만듭니다."},{"t":"p","html":"사람이 반복하던 설계·해석·검증은 시스템이 수행하고, 엔지니어는 결과 확인과 핵심 의사결정에 집중하는 <b>Human-in-the-Loop 설계 Workflow</b>를 지향합니다."},{"t":"steps","items":[{"title":"Step 1 | 2026~2027, 아이디어에서 3D 설계","body":"2026년 9~10월 클라우드 오픈베타로 자연어나 CAD 스케치만으로 기계설계를 시작하는 제품 경험을 검증하고, 대기업에는 보안·업무환경에 맞춘 온프레미스·연동형 제품을 제공합니다. AI Agent–METHEUS–CAD를 연결해 아이디어가 실제 3D 설계 결과로 이어지는 Workflow를 완성합니다."},{"title":"Step 2 | 2027~, 설계에서 제조까지","body":"제작 가능한 형상과 표준부품을 기반으로 BOM, 제조 공정, 협력사·제조사 연계까지 확장해 설계 결과가 시제품과 양산으로 이어지는 Workflow를 구축합니다. 장기적으로 아이디어만 있으면 설계·검증을 거쳐 실제 제품 제작까지 연결되는 기계개발 플랫폼으로 발전합니다."}]}],"titleBr":"누구나 아이디어만으로\n실제 제작 가능한 기계를 설계하는 세상"},{"key":"mentor","ko":"멘토","en":"MENTOR","label":"전담 멘토","title":"","blocks":[{"t":"mentor","name":"채명수","role":"전담 멘토","quote":"AI 모델 최적화 기술로 기술특례 상장","career":["현) 노타(Nota AI) 대표","전) KAIST 인공지능연구소 Research Scientist","전) KAIST IT융합연구소 Research Engineer"],"photo":"m4"},{"t":"mentor","name":"황희철","role":"전담 멘토","quote":"딥테크 창업 후 한화 매각, 현 VC 그룹장","career":["현) 한화자산운용 VC투자그룹 그룹장","전) 블루포인트파트너스 본부장","전) 한화 무인화센터 팀장","전) 마이크로에어로봇 대표"],"photo":"m5"}]}],"q":["아이디어가 제품이 되기까지,","얼마나 걸릴까요?"],"intro":"아이디어오션은 기계·제품 설계를 자동화하는 AI 에이전트, ‘METHEUS’를 만드는 회사입니다.","story":["새로운 기계나 제품을 하나 만들려면 수많은 조건을 함께 고려해야 합니다. 원하는 기능을 구현하면서도 충분히 튼튼해야 하고, 크기와 비용도 맞아야 합니다. 그래서 엔지니어는 여러 설계안을 만들고 성능을 비교하며, 문제가 있으면 다시 고치는 과정을 반복합니다.","METHEUS는 이런 요구사항을 이해하고, 다양한 설계안을 탐색해 3D 설계 모델로 구현합니다. 움직임과 강도를 해석하고 결과를 검토하며 설계안을 개선합니다. 이를 통해 엔지니어는 반복 작업을 줄이고, 무엇을 만들지, 어떤 설계가 더 좋은지 판단하는 데 집중할 수 있습니다. 엔지니어가 무엇을 만들지 정한다면, 아이디어오션은 그 아이디어가 제품이 되는 과정을 앞당깁니다."],"handle":"IDeAOcean","qn":"Q-02","wlogo":"w_idea","wlogoScale":0.78,"introLines":["아이디어오션은 기계·제품 설계를 자동화하는 AI 에이전트,","‘METHEUS’를 만드는 회사입니다."]},{"id":"39de585d-9e13-4fdd-b743-39de887f688b","ko":"테파로보틱스","en":"TEFA Robotics","tagline":"하나의 피지컬 AI로 모든 빈피킹 문제를 푼다","accent":"#000000","logo":"logo2","core":"피지컬 AI · 빈피킹을 위한 표준화된 범용 AI 모델 및 솔루션","home":"http://www.tefarobotics.com","homeLabel":"www.tefarobotics.com","email":"info@tefarobotics.com","sections":[{"key":"why","ko":"사업 배경","en":"WHY NOW","label":"사업 배경","title":"리쇼어링과 인력난으로 자동화 수요는 폭발하는데, 기존 방식은 여전히 비쌉니다","blocks":[{"t":"p","html":"최근 글로벌 제조업 리쇼어링과 심각한 인력난은 공장 자동화의 폭발적인 수요를 초래하고 있습니다. 그럼에도 불구하고 기존 기술들을 활용한 <b>로봇 자동화는 여전히 비쌉니다.</b> 복잡한 엔지니어링을 필요로 하기 때문입니다."},{"t":"p","html":"언어를 이해할 수 있는 피지컬 AI 기술은 이러한 복잡한 엔지니어링에 대한 비용을 줄이고, 단순한 언어 지시로 더욱 복잡한 로봇 자동화를 구현할 수 있게 하는 길을 열었습니다. 이제 <b>피지컬 AI 기술로 기존 방식보다 경제적이고, 더욱 고난도의 로봇 자동화를 구현</b>하여 폭발적인 자동화 수요를 충족시킬 시점이 왔습니다."}]},{"key":"problem","ko":"문제","en":"PROBLEM","label":"해결하려는 문제","title":"로봇이 박스 안 물체를 잡아 옮기는 것, 기술은 풀렸지만 경제적으로는 안 풀렸습니다","blocks":[{"t":"p","html":"상자 안의 물체를 하나씩 집어내는 일을 빈피킹(Bin-picking)이라고 부릅니다. 이 문제는 모든 제조업 및 물류 현장에 존재하는 매우 거대한 수요를 가진 문제입니다. 문제의 중요도가 워낙 높기에 물체를 분류해 주는 전용 기기들부터, 3D 카메라와 로봇을 이용한 구현 사례까지 다양한 해결책이 있습니다. 그래서 이미 풀린 문제처럼 보입니다."},{"t":"p","html":"하지만 빈피킹을 기존 기술로 구현하기 위해선 각 물체별로 커스터마이징이 필요하고, 이를 위한 엔지니어링 비용이 많이 발생합니다. 그래서 일반적으로 투자 대비 이득이 낮습니다. <b>기술적으로는 풀렸지만, 경제적으로는 풀리지 않은 문제입니다.</b>"}]},{"key":"who","ko":"타깃","en":"WHO","label":"핵심 타깃","title":"","blocks":[{"t":"targets","items":[{"k":"제조업 기업","tags":["완성차","자동차 부품","코스메틱","바이오","F&B"],"d":"플라스틱 사출물이나 금속 가공물 등의 물체를 공급받아 제조에 사용하는 제조업 기업"},{"k":"로봇 자동화 SI 기업","tags":null,"d":"제조 현장에서 로봇 자동화 솔루션을 구축·공급하는 SI 기업"}]}]},{"key":"market","ko":"시장","en":"MARKET","label":"시장 규모","title":"제조업 리쇼어링과 인력난으로 폭발적으로 성장하는 로봇 자동화 시장","blocks":[{"t":"stats","items":[{"value":"약 5.4조 원","label":"<b>TAM</b> · 전 세계 제조·물류 현장에서 사람이 직접 하는 빈피킹 작업에 쓰이는 인건비 기준"}]},{"t":"sub","text":"MARKET PROOF"},{"t":"list","items":["글로벌 완성차 기업 현장 공급을 통한 경쟁사 및 기존 방식 대비 상업성 입증","산업용 평행·흡착·자석 그리퍼 등 4종 이상 그리퍼 지원 및 7종 부품 양산 레벨 피킹 공급"]}]},{"key":"goal","ko":"지향점","en":"GOAL","label":"지향점","title":"재학습 없이 복사·붙여넣기 가능한 범용 로봇 AI 구축, 글로벌 신규 설치 로봇의 1%에 설치되는 표준 솔루션","blocks":[{"t":"p","html":"다양한 고객사에게 단 하나의 AI만 제공하면서 대응하는 산업용 하드웨어의 수와 피킹 가능한 물체 수를 꾸준히 늘려갑니다. 제품이 판매될수록 성능이 강화되어 범용 로봇 AI로 진화하는 구조를 지향합니다."},{"t":"steps","items":[{"title":"Step 1 | 하나의 AI로 범용 플라이휠 검증","body":"하나의 AI만 지속적으로 업그레이드하면서 다양한 공정에 공급해 범용 AI 개발 플라이휠을 검증하고, 규격 표준화로 다양한 고객 확보 통로를 구축합니다."},{"title":"Step 2 | 2028년 2분기, 표준 빈피킹 솔루션 기업","body":"부품 1,000종 이상, 하드웨어 20종 이상을 양산 레벨로 대응해 범용 빈피킹 AI를 완성하고, 연간 로봇 500대 이상 납품 가능한 표준 빈피킹 솔루션 기업으로 성장합니다."},{"title":"Step 3 | 빈피킹에서 핸들링·조립으로","body":"빈피킹 이후 공정인 핸들링·조립으로 확대해 전 세계 산업용 로봇 연간 신규 설치 대수의 1%에 해당하는 연 7,000대 납품 수준을 확보하고, 글로벌 범용 로봇 자동화 솔루션 기업으로 도약합니다."}]}]},{"key":"mentor","ko":"멘토","en":"MENTOR","label":"전담 멘토","title":"","blocks":[{"t":"mentor","name":"정성훈","role":"전담 멘토","quote":"보행 재활 로봇 기술로 2024년 기술특례 상장","career":["전) 엔젤로보틱스 부대표, COO","전) National Instruments Area Sales Manager","전) 현대통신 Electric Circuit Engineer","전) 한국공학대학교 메카트로닉스공학과 겸임교수"],"photo":"m1"}]}],"q":["처음 보는 물건도","로봇이 알아서 집을 수 있을까요?"],"intro":"테파로보틱스는 어디서든 바로 일할 수 있는 로봇의 두뇌, VLA를 만드는 회사입니다.","story":["“저기 상자에 있는 볼트 좀 꺼내 줘.” 사람에게는 쉬운 부탁이지만 로봇에게는 어려운 일입니다. 지금까지 로봇은 물건마다, 작업마다 따로 프로그램을 만들어 줘야 움직일 수 있었습니다.","테파로보틱스의 VLA는 로봇이 보고(Vision), 이해하고(Language), 움직이는(Action) AI입니다. 하나의 모델로 다양한 일을 해내고, 최근에는 단 한 번도 본 적 없는 물건까지 따로 가르치지 않고 집어내는 데 성공했습니다. 이 기술은 이미 미국 완성차 대기업의 양산 라인에서 쓰이고 있습니다. ChatGPT가 글을 이해하고 답한다면, 테파로보틱스는 로봇이 눈앞의 상황을 이해하고 몸으로 답하게 만듭니다."],"handle":"TEFA ROBOTICS","qn":"Q-03","wlogo":"w_tefa","wlogoScale":1.1,"introLines":["테파로보틱스는 어디서든 바로 일할 수 있는 로봇의 두뇌,","VLA를 만드는 회사입니다."]},{"id":"c9084261-8e7f-4b41-80f3-adf488ae48a7","ko":"퍼스트랩","en":"FUST Lab","tagline":"영원한 화학물질 PFAS, 소각 없이 현장에서 완벽 분해","accent":"#2D969D","logo":"logo1","core":"환경 딥테크 · 초음파 기반 PFAS(과불화화합물) 분해 및 친환경 수처리 솔루션","home":"http://www.fustlab.com","homeLabel":"www.fustlab.com","email":"sales@fustlab.com","sections":[{"key":"why","ko":"사업 배경","en":"WHY NOW","label":"사업 배경","title":"글로벌 규제의 직격탄이 된 PFAS, 단순 환경 이슈를 넘어 기업의 법적 리스크가 되었습니다","blocks":[{"t":"p","html":"잘 변하지 않고 물과 기름을 모두 튕겨내는 PFAS는 반도체·제약·화장품 등 주요 산업 전반에 널리 쓰였으나, 자연 분해되지 않는 ‘영원한 화학물질’로 암과 호르몬 이상을 유발하며 <b>미·유럽·일본 등 글로벌 규제가 전격 시행</b>되고 있습니다."},{"t":"p","html":"3M의 13조 원 규모 소송 합의금 사례처럼 PFAS는 <b>제조·수입·공급망 전체의 중대한 법적 책임 문제</b>로 부상했으며, 세계경제포럼(WEF)은 2026년 10대 미래 기술로 ‘PFAS 파괴 기술’을 선정했습니다."}]},{"key":"problem","ko":"문제","en":"PROBLEM","label":"해결하려는 문제","title":"2차 폐기물과 소각 비용이 맴도는 악순환, 해결책이어야 할 초음파는 실험실을 벗어나지 못했습니다","blocks":[{"t":"p","html":"지금의 PFAS 처리는 활성탄이나 수지에 붙여 걸러낸 뒤, 그 농축물을 소각장이나 매립지로 보내는 방식입니다. <b>없애는 게 아니라 옮기는 것</b>이어서 2차 폐기물과 운송·소각 비용이 계속 들고, 태우는 과정에서 탄소도 나옵니다. 사슬이 짧은 단쇄 PFAS는 활성탄에 잘 붙지도 않아 옮기는 도중에 그대로 새어 나갑니다."},{"t":"p","html":"초음파가 강한 화학 결합을 끊을 수 있다는 건 오래 알려진 사실이지만, 기존 장비는 에너지가 한 방향으로만 나가 고르게 닿지 않고 열이 쌓여 오래 돌릴 수 없어 <b>실험실을 벗어나지 못했습니다</b>."}]},{"key":"who","ko":"타깃","en":"WHO","label":"핵심 타깃","title":"","blocks":[{"t":"targets","items":[{"k":"반도체·케미컬·제약 제조사","tags":null,"d":"공정 내 PFAS를 사용하거나 PFAS 폐수가 발생하는 반도체·케미컬·제약 제조사"},{"k":"글로벌 수처리 기업","tags":null,"d":"글로벌 수처리 전문 기업"}]}]},{"key":"market","ko":"시장","en":"MARKET","label":"시장 규모","title":"글로벌 환경 규제 강화로 폭발하는 PFAS 파괴 및 수처리 시장","blocks":[{"t":"stats","items":[{"value":"약 6.5조 원","label":"<b>TAM</b> · 2033년 기준 글로벌 PFAS 처리 시장"},{"value":"약 2조 원","label":"<b>SAM</b> · 2033년 기준"}]},{"t":"note","html":"<b>성장률</b> · 연평균 10.1% 성장 전망"},{"t":"sub","text":"MARKET PROOF"},{"t":"list","items":["히타치 하이텍과의 컨소시엄을 통한 일본 환경성 실증 검증","현대코퍼레이션 협력을 통한 독일 거점(연구소·데모룸) 구축","글로벌 대기업 및 정부 기관 레퍼런스 확보"]}],"titleBr":"글로벌 환경 규제 강화로\n폭발하는 PFAS 파괴 및 수처리 시장"},{"key":"goal","ko":"지향점","en":"GOAL","label":"지향점","title":"현장 초음파 분해 장비를 넘어 AI 기반 글로벌 초음파 공정/수처리 플랫폼으로","blocks":[{"t":"p","html":"원통형 구조로 에너지를 중앙에 집중시키고 온도를 제어해 30일 이상 연속 운전이 가능한 독자적 초음파 기술을 갖고 있습니다. 이동이나 소각 없이 현장에서 PFAS를 분해하는 것이 출발점입니다."},{"t":"steps","items":[{"title":"Step 1 | 초음파 PFAS 분해 장비로 공정 수처리 표준 정착","body":"고효율 초음파 PFAS 분해 장비(CAVITOX) 공급을 통해 글로벌 주요 반도체·케미컬 제조 공정 내 수처리 표준을 정착시킵니다."},{"title":"Step 2 | AI 수처리 플랫폼과 나노 제조 공정으로 확장","body":"축적된 운전 데이터 기반의 AI 최적화 수처리 플랫폼을 구축하고, 나노 분산·유화 장비(DEBREX)를 포함해 산업 현장의 유해물질 분해와 나노 제조 공정 전체를 아우르는 글로벌 초음파 딥테크 기업으로 확장합니다."}]}]},{"key":"mentor","ko":"멘토","en":"MENTOR","label":"전담 멘토","title":"","blocks":[{"t":"mentor","name":"김현준","role":"전담 멘토","quote":"의료 AI 기업 뷰노 창업, 2021년 코스닥 상장","career":["현) 클롭 공동대표","현) 바이트 대표","현) 퓨처플레이 벤처파트너","현) DHP 벤처파트너","현) 매쉬업벤처스 Advisor","전) 뷰노 창업자(대표)"],"photo":"m7"}]}],"q":["걸러낸 오염물질은","어디로 갈까요?"],"intro":"퍼스트랩은 초음파로 오염물질을 분해하고, 같은 기술로 물질을 고르게 섞는 장비를 만드는 회사입니다.","story":["필터로 걸러낸 오염물질은 사라진 게 아니라 한곳에 모였을 뿐입니다. 특히 반도체나 의약품을 만드는 공장에서 나오는 PFAS라는 물질은 자연에서 거의 분해되지 않아서, 모아두면 그대로 남아 있습니다.","퍼스트랩은 초음파의 힘을 한곳에 모아, 이 물질을 현장에서 바로 부숴 없애는 기술을 개발합니다. 같은 초음파로 물과 기름처럼 잘 섞이지 않는 물질을 고르게 섞으면, 피부에 가볍게 스며드는 화장품도 만들 수 있습니다. 이 기술을 실제 공장에서 쓸 수 있는 장비로 만들었습니다. 일본에서는 자회사를 통해 판매하고 있고, 미국 Hershey를 비롯해 독일과 영국 현장에서도 검증을 이어가고 있습니다. 필터가 오염물질을 모아둔다면, 퍼스트랩은 그 자리에서 없앱니다."],"handle":"FUST Lab.","qn":"Q-04","wlogo":"w_fust","wlogoScale":1.2,"introLines":["퍼스트랩은 초음파로 오염물질을 분해하고,","같은 기술로 물질을 고르게 섞는 장비를 만드는 회사입니다."]},{"id":"ac2cd204-4e27-44eb-8787-0b5e5bad447a","ko":"스페이스린텍","en":"Space Liintech","tagline":"지구의 한계를 넘어 우주에서 신약을 만드는 플랫폼","accent":"#004097","logo":"logo0","core":"우주 바이오 · 미세중력(무중력) 환경 기반 신약 연구 및 의약품 생산 플랫폼","home":"http://www.spaceliintech.com","homeLabel":"www.spaceliintech.com","email":"info@spaceliintech.com","sections":[{"key":"why","ko":"사업 배경","en":"WHY NOW","label":"사업 배경","title":"우주 제조는 상업화됐지만, 신약 개발은 여전히 중력에 갇혀 있습니다","blocks":[{"t":"p","html":"신약 개발의 핵심인 단백질 구조 분석은 지상 중력 환경에서 결함과 불균일함이라는 한계에 부딪힙니다. 그러나 무중력 우주 환경에서는 <b>고순도 단백질 결정화</b>가 가능해집니다."},{"t":"p","html":"글로벌 제약사 머크(Merck)는 국제우주정거장(ISS) 실험을 통해 면역항암제 ‘키트루다’의 고농도 제형 개발에 필요한 과학적 가능성을 탐색했으며, 이는 이후 피하주사 제형 개발 가능성을 뒷받침하는 데 기여한 대표 사례입니다."},{"t":"p","html":"로켓 발사 비용 하락과 회수 캡슐 기술의 발전으로 <b>우주 바이오는 단순 연구를 지나 거대한 산업으로 급격히 전환</b>되고 있습니다."}]},{"key":"problem","ko":"문제","en":"PROBLEM","label":"해결하려는 문제","title":"장비부터 인증과 회수까지, 제약사 홀로 우주의 진입장벽을 넘기란 어렵습니다","blocks":[{"t":"p","html":"제약·바이오 기업이 우주에서 실험을 진행하려면 우주항공 규격 장비 제작, 글로벌 안전 심사, 발사체 확보, 무인 자동화 운용, 지구 회수 및 데이터 분석까지 <b>수많은 전문 허들</b>을 넘어야 합니다."},{"t":"p","html":"제약사가 이를 직접 수행하는 것은 사실상 불가능합니다. 지금까지 국내에는 이러한 <b>우주 진입 경로 자체가 없어</b> 해외 스타트업에 의존할 수밖에 없었습니다."}]},{"key":"who","ko":"타깃","en":"WHO","label":"핵심 타깃","title":"","blocks":[{"t":"targets","items":[{"k":"제약·바이오 기업","tags":null,"d":"지상 중력의 한계를 극복하고 신약 개발 성공률을 높이고자 하는 제약·바이오 기업"},{"k":"무중력 연구기관","tags":null,"d":"무중력 환경 실험이 필요한 연구기관"}]}]},{"key":"market","ko":"시장","en":"MARKET","label":"시장 규모","title":"연구 단계를 지나 거대 의약품 산업으로 팽창하는 우주 바이오","blocks":[{"t":"stats","items":[{"value":"약 2.9조 원","label":"<b>TAM · 2025년</b> · 글로벌 우주 바이오 시장"},{"value":"약 7조 원","label":"<b>2030년 전망</b> · 연평균 19% 성장 전망"}]},{"t":"note","html":"출처: Dataintelo Report 2026"},{"t":"sub","text":"MARKET PROOF"},{"t":"list","items":["국내 최초 ISS 모듈 탑재·실험 및 회수 분석 완수","누리호 4차 발사 위성을 통한 항암제 결정화 실험 진행","보스턴 지사 기반 하버드·MGH 공동 연구 수행","글로벌 빅파마의 ISS 실험과 우주 회수 캡슐 서비스 활성화로 우주 의약품 제조 수요 확인"]}],"titleBr":"연구 단계를 지나\n거대 의약품 산업으로 팽창하는 우주 바이오"},{"key":"goal","ko":"지향점","en":"GOAL","label":"지향점","title":"우주 신약 연구 서비스(CRO)를 넘어, 글로벌 우주 의약품 위탁생산(CDMO)으로","blocks":[{"t":"p","html":"지상 드롭타워 무중력 테스트부터 우주정거장·위성 실증까지, 제약사가 넘어야 했던 허들을 하나의 경로로 연결하는 플랫폼을 만들고 있습니다. 연구 위탁(CRO)으로 레퍼런스를 쌓고, 우주에서 직접 의약품을 생산하는 위탁생산(CDMO)으로 나아갑니다."},{"t":"steps","items":[{"title":"Step 1 | 우주 CRO 구축","body":"ISS 및 누리호 실증 레퍼런스와 보스턴 지사 기반의 공동 연구를 바탕으로 글로벌 우주 신약 연구 위탁 서비스(CRO) 시장에 안착합니다."},{"title":"Step 2 | 우주 CDMO 도약","body":"우주 환경 내 독자적 제조 인프라를 확장해, 우주에서 고부가 의약품을 직접 양산하는 글로벌 우주 바이오 CDMO 기업으로 도약합니다."}]}]},{"key":"mentor","ko":"멘토","en":"MENTOR","label":"전담 멘토","title":"","blocks":[{"t":"mentor","name":"홍기현","role":"전담 멘토","quote":"세 번의 창업, 두 번의 매각과 한 번의 상장","career":["현) 코르트 대표","전) 토모큐브 대표","전) 블루포인트파트너스 파트너","전) 와이즈플래닛 대표","전) 한국포톤다이나믹스 지사장","전) 애크론 대표"],"photo":"m0"}]}],"q":["신약 개발을 꼭","지구에서만 해야 할까요?"],"intro":"스페이스린텍은 우주의 미세중력 환경을 활용해 단백질을 결정화하고, 결정화된 약제를 생산하는 회사입니다.","story":["신약 연구에서는 질병의 원인이 되는 단백질의 구조를 정확히 알아내는 것, 그리고 완성된 약제를 결정화하는 것이 아주 중요합니다. 이를 위해 단백질을 규칙적인 결정으로 만들어야 하는데, 지구에서는 중력에 따른 대류나 침강 때문에 원하는 결과를 얻기 어려울 때가 있습니다.","그런데 중력의 영향이 크게 줄어드는 우주에서는 이야기가 달라집니다. 스페이스린텍은 우주에서의 제약 연구와 생산에 필요한 장치를 직접 개발하고, 실제 우주 환경에서 실증하며 그 가능성을 확인하고 있습니다. 지상에서는 넘기 어려웠던 신약 개발의 숙제를, 스페이스린텍은 우주에서 풀어냅니다."],"handle":"Space LiinTech","qn":"Q-05","wlogo":"w_space","wlogoScale":1,"introLines":["스페이스린텍은 우주의 미세중력 환경을 활용해 단백질을 결정화하고,","결정화된 약제를 생산하는 회사입니다."]},{"id":"a7f1fb74-7335-46e3-b0b7-0a9e37705cdf","ko":"피트인","en":"PITIN","tagline":"8분 만에 배터리 교체, 영업용 전기차 시대의 에너지스테이션","accent":"#DA423A","logo":"logo3","core":"로봇·AI·재생에너지로 영업용 전기차의 모든 운영을 연결하는 미래 에너지스테이션","home":"http://www.pitin-ev.com","homeLabel":"www.pitin-ev.com","email":"contact@pitin-ev.com","sections":[{"key":"why","ko":"사업 배경","en":"WHY NOW","label":"사업 배경","title":"전환 효과는 영업용 차량이 가장 큰데, 전환 속도는 가장 느립니다","blocks":[{"t":"p","html":"택시·물류차 같은 영업용 차량은 승용차보다 오래, 많이 달립니다. 전기차로 바꿨을 때 에너지 비용과 탄소 배출이 줄어드는 효과가 가장 큰 영역입니다."},{"t":"p","html":"그런데 실제 전환은 빠르지 않습니다. 차량 가격뿐 아니라 충전으로 서는 시간, 배터리 고장 위험, 정비 인프라 부족, 잔존가치 불확실성까지 운수사업자가 전부 떠안아야 하기 때문입니다. 운수사업자가 전기차로 넘어가지 못하는 이유는 <b>충전기가 모자라서가 아니라, 이 구조 전체</b>입니다."}]},{"key":"problem","ko":"문제","en":"PROBLEM","label":"해결하려는 문제","title":"영업용 전기차의 문제는 충전 하나가 아니라, 에너지와 차량 운영 전체의 문제입니다","blocks":[{"t":"p","html":"영업용 전기차는 충전 대기시간, 에너지 비용, 배터리 열화와 고장, 정비, 차량 잔존가치가 모두 수익성과 직접 연결됩니다. 기존 인프라는 <b>전력을 공급하는 데 그쳐,</b> 차량을 얼마나 오래 굴릴 수 있는지, 배터리 위험을 누가 질지, 정비·관리 비용을 어떻게 낮출지는 다루지 못합니다."},{"t":"p","html":"전기차가 늘수록 문제는 하나 더 생깁니다. 많은 영업용 차량이 동시에 충전하면 피크전력, 충전시간 최적화, 재생에너지 활용까지 <b>'에너지를 어떻게 효율적으로 공급할 것인가'</b>가 인프라의 경쟁력이 됩니다."}]},{"key":"who","ko":"타깃","en":"WHO","label":"핵심 타깃","title":"","blocks":[{"t":"targets","items":[{"k":"택시·물류 운송사업자","tags":null,"d":"법인·개인택시 사업자, 물류·택배 운송사, 버스·항만 운송사업자"},{"k":"자율주행 플릿 운영사","tags":null,"d":"자율주행 택시·물류 플릿 운영사"}]}]},{"key":"market","ko":"시장","en":"MARKET","label":"시장 규모","title":"택시·1톤 화물차 약 191만 대에서 전체 상용차와 자율주행 플릿으로","blocks":[{"t":"stats","items":[{"value":"약 23만 대","label":"<b>국내 택시</b> · 법인·개인택시 전체"},{"value":"약 168만 대","label":"<b>1톤급 화물차</b> · 화물차 약 380만 대 중 피트인이 먼저 집중하는 시장"}]},{"t":"p","html":"핵심 타깃인 택시와 1톤급 화물차를 합치면 <b>약 191만 대</b>입니다."},{"t":"p","html":"주행거리와 가동률이 높은 택시·1톤 물류차부터 시작해 대형 화물차, 버스, 항만 트레일러로 넓히고, 장기적으로는 자율주행 플릿의 에너지 공급·차량 운영 인프라 시장에 진입합니다."},{"t":"sub","text":"MARKET PROOF"},{"t":"list","items":["안양 1호 스테이션에서 영업용 전기차 고객 대상 BSS, 멤버십 충전, 배터리케어 등 서비스 상용 운영 및 시장성 검증","기존 충전비용이 낮아 전환 장벽이 높은 안양 지역에서 고객 반복 이용 및 법인택시 사업자 지속 가입 확보","다른 지역으로 확장 가능한 사업적 가능성 확인"]}],"titleBr":"택시·1톤 화물차 약 191만 대에서\n전체 상용차와 자율주행 플릿으로"},{"key":"goal","ko":"지향점","en":"GOAL","label":"지향점","title":"영업용 전기차에서 자율주행 플릿까지 연결하는 차세대 에너지스테이션 플랫폼","blocks":[{"t":"p","html":"<b>충전소가 아니라,</b> 충전·배터리·정비·차량 관리를 하나의 인프라에서 제공하고 필요한 에너지를 가장 효율적으로 공급하는 에너지스테이션 플랫폼을 만들고 있습니다."},{"t":"p","html":"BSS 로봇, 머신비전, AI 운영관리, 에너지 최적화로 스테이션 운영을 표준화해, 어느 지역이든 같은 품질과 효율로 빠르게 늘릴 수 있는 구조가 목표입니다."},{"t":"steps","items":[{"title":"Step 1 | 직접 운영으로 플랫폼 검증","body":"안양 1호 검증 완료, 인천 2호 구축 중, 서울 노원 3호 준비, 부산·광주 부지 탐색. 초기 거점은 피트인이 직접 운영하며 지역과 고객이 달라도 같은 수익성과 서비스 품질이 나오는지 확인합니다."},{"title":"Step 2 | 기술로 스테이션 표준화·확장","body":"2세대 BSS 로봇, 머신비전·모방학습, 스테이션 운영 AI Agent로 사람 숙련도에 의존하는 운영을 줄이고 구축·운영 과정을 표준화합니다. 태양광 등 분산에너지와 차량·배터리 수요 데이터를 연계한 S2G(Station to Grid)로 에너지 비용과 운영 효율을 개선합니다."},{"title":"Step 3 | 영업용 EV에서 자율주행 플릿 인프라로","body":"택시·물류차를 넘어 다양한 영업용 전기차로 넓히고, 장기적으로 자율주행 플릿이 사람 개입을 최소화한 채 충전·에너지·배터리·정비·세차·차량 관리를 받는 도심형 모빌리티 인프라로 발전합니다."}]}]},{"key":"mentor","ko":"멘토","en":"MENTOR","label":"전담 멘토","title":"","blocks":[{"t":"mentor","name":"권혁찬","role":"전담 멘토","quote":"쏘카 동남아 진출 주도, 42dot 자율주행 사업 총괄","career":["현) 빅뱅엔젤스 부대표","전) 포티투닷(42dot) 사업총괄 PMO","전) 쏘카 부대표"],"photo":"m2"}]}],"q":["전기차 시대, 에너지 인프라는","어떻게 달라져야 할까요?"],"intro":"피트인은 대한민국의 LPG 충전소를 대체할 차세대 에너지 스테이션 인프라 플랫폼을 만드는 회사입니다.","story":["전기차 배터리를 구매하는 대신 구독하고, 충전을 기다리는 대신 교체하는 방식입니다. 피트인은 배터리 교체 구독 서비스 BSS로 택시와 물류 차량 등 영업용 전기차에 최적화된 에너지 인프라를 구축합니다. 하나의 스테이션에서 배터리 교체, 전용 충전, 배터리 관리, 차량 정비까지 제공해 운영 효율을 높입니다. 보관된 배터리는 에너지 저장장치로 활용해 전력 수요를 평탄화하고, 에너지 관리 기술도 개발합니다.","앞으로는 24시간 운행하는 자율주행 택시까지 지원하는 인프라로 확장합니다. 배터리 소유에서 구독으로, 충전에서 교체로, 에너지 소비에서 효율적인 관리로. 피트인은 대한민국 수송 부문 에너지 전환의 새로운 표준을 만들어갑니다."],"handle":"PIT IN","qn":"Q-06","wlogo":"w_pitin","wlogoScale":1.05,"introLines":["피트인은 대한민국의 LPG 충전소를 대체할 차세대 에너지 스테이션","인프라 플랫폼을 만드는 회사입니다."]},{"id":"2d13b653-f357-492f-ad91-db07a42aab38","ko":"갭텍","en":"GAPT","tagline":"반도체 공장의 온실·유독가스, 탄소 배출 없이 24시간 분해","accent":"#1EAA39","logo":"logo4","core":"기후테크 · 산업용 온실가스·유해가스 처리 시스템 · 대기환경 설비","home":"http://www.gap-t.com","homeLabel":"www.gap-t.com","email":"eh.kim@gap-t.com","sections":[{"key":"why","ko":"사업 배경","en":"WHY NOW","label":"사업 배경","title":"첨단산업이 커질수록 온실가스는 늘어나는데, 규제는 처리 효율과 탄소저감을 동시에 요구합니다","blocks":[{"t":"p","html":"반도체·디스플레이 등 첨단산업에서는 PFCs, SF₆, N₂O, NH₃, COS 등 여러 온실가스와 유해가스가 발생합니다. 특히 AI·HBM 등 고성능 반도체 수요 확대와 생산라인 증설로 <b>배출가스 처리의 중요성이 더욱 커지고</b> 있습니다."},{"t":"p","html":"<b>배출가스를 제거하는 것만으로는 부족합니다.</b> 처리 효율, 에너지 사용량, 유지보수 비용, 그리고 처리 과정의 탄소배출까지 함께 낮춰야 환경규제와 탄소저감 요구에 동시에 대응할 수 있습니다."}]},{"key":"problem","ko":"문제","en":"PROBLEM","label":"해결하려는 문제","title":"기존 설비는 운영비와 유지보수 부담이 크고, 온실가스를   st.ci = (i + N) % N; st.gen++;
  var c = DATA[st.ci];
  $('dBar').innerHTML = esc(c.qn) + ' · <span class="ko">' + esc(c.ko) + '</span> ' + esc(c.handle);
  $('dIdx').textContent = pad(st.ci + 1) + '/' + pad(N);
  var w = $('bWeb'), m = $('bMail');
  if (c.home){ w.setAttribute('href', c.home); w.classList.remove('hide'); } else { w.removeAttribute('href'); w.classList.add('hide'); }
  if (c.email){ m.setAttribute('href', mailHref(c)); m.classList.remove('hide'); } else { m.removeAttribute('href'); m.classList.add('hide'); }
  var rv = reveal ? ' rv' : '';
  $('intro').innerHTML = imgTag(c.wlogo, 'd-logo' + rv, Math.round(36 * (c.wlogoScale || 1)), c.ko) +
    '<h2 class="d-q" id="dQ">' + introHTML(c, reveal ? 0 : -1) + '</h2>' +
    c.story.map(function(s){ return '<p class="d-p' + rv + '">' + esc(s) + '</p>'; }).join('') +
    (c.core ? '<div class="d-core' + rv + '"><span class="mono">core_field</span><span>' + esc(c.core) + '</span></div>' : '');
  keepDots($('intro'));
  $('thread').innerHTML = '';
  $('next').className = 'next' + rv;
  $('pad').style.height = '0px';
  st.asked = {}; st.busy = false; st.last = -1;
  buildChips(); updateNext();
  show('detail');
  window.scrollTo(0, 0);
  spy();
  if (reveal) playReveal(c);
}
/* 회사 소개: 강제 줄바꿈(introLines) 대신 intro 원문을 자동 줄바꿈. 타자 효과는 남은 글자를 투명 처리해 줄 위치가 흔들리지 않게 함 */
function introHTML(c, n){
  var t = c.intro;
  if (n < 0 || n >= t.length) return esc(t);
  return esc(t.slice(0, n)) + '<span class="cur"></span><span class="tw">' + esc(t.slice(n)) + '</span>';
}
var rvT = [];
function revealing(){ return rvT.length > 0; }
function skipReveal(){
  if (!rvT.length) return;
  rvT.forEach(clearTimeout); rvT = [];
  var c = DATA[st.ci];
  $('dQ').innerHTML = introHTML(c, -1); keepDots($('dQ'));
  [].forEach.call(document.querySelectorAll('#panel .rv'), function(el){ el.classList.add('on'); });
  st.busy = false; updateBar();
}
function playReveal(c){
  rvT.forEach(clearTimeout); rvT = [];
  var items = [].slice.call(document.querySelectorAll('#panel .rv')), q = $('dQ'), id = st.ci, g = st.gen;
  var later = function(fn, ms){ rvT.push(setTimeout(function(){ if (st.ci === id && st.gen === g) fn(); }, ms)); };
  st.busy = true;
  if (RM.matches){ later(function(){ skipReveal(); }, 0); return; }
  if (items[0]) later(function(){ items[0].classList.add('on'); }, 80);
  var full = c.intro, t0 = 520, step = 38;
  for (var i = 1; i <= full.length; i++) (function(i){
    later(function(){ q.innerHTML = introHTML(c, i); keepDots(q); }, t0 + i * step);
  })(i);
  var t = t0 + full.length * step + 260;
  items.slice(1).forEach(function(el){ later(function(){ el.classList.add('on'); }, t); t += el.classList.contains('d-p') ? 380 : 300; });
  later(function(){ st.busy = false; rvT = []; updateBar(); }, t + 200);
}
$('panel').addEventListener('pointerdown', function(e){ if (rvT.length && !e.target.closest('button,a')) skipReveal(); });

function buildChips(){
  $('chips').innerHTML = secs(DATA[st.ci]).map(function(s, k){
    return '<button type="button" class="chip" data-k="' + k + '">' + esc(CONFIG.keys[s.key] || s.label) + '</button>';
  }).join('');
}
$('chips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  if (rvT.length) skipReveal();   /* 진입 연출 중이면 바로 끝내고 질문으로 */
  focusAsk(+b.getAttribute('data-k'));
});
function askLabel(s){ return CONFIG.asks[s.key] || s.label; }
function nextIndex(){ var S = secs(DATA[st.ci]); return st.last + 1 < S.length ? st.last + 1 : -1; }
/* 키워드 탭: 이전 답변을 비우고 그 섹션부터 다시 시작 (본문 순서 = 키워드 순서) */
function focusAsk(k){
  if (st.busy) return;
  var turns = $('thread').children;
  if (turns.length === 1 && turns[0].id === 'turn-' + k){ ask(k); return; }
  $('thread').innerHTML = ''; st.asked = {}; st.last = k - 1;
  ask(k);
}
function ghost(attr, small, text){
  return '<div class="ghost"><button type="button" ' + attr + '><span><small>' + esc(small) + '</small><em>' + esc(text) + '</em></span><svg aria-hidden="true"><use href="#i-ret"/></svg></button></div>';
}
function updateNext(){
  var k = nextIndex(), S = secs(DATA[st.ci]);
  $('next').innerHTML = k < 0 ? ghost('data-home="1"', 'all_records · ' + N, '다른 기업 이야기 보기')
                              : ghost('data-k="' + k + '"', 'next_question', askLabel(S[k]));
  observeCard();
}
/* 질문하기: 말풍선 > 생각 모션(0.5초) > 답변. 직전 질문 말풍선을 상단 바 바로 아래로 */
function ask(k){
  var c = DATA[st.ci], s = secs(c)[k];
  if (!s || st.busy) return;
  var gap = 12;
  if (st.asked[k]){ var ex = $('turn-' + k); if (ex) scrollToY(docTop(ex) - barH() - gap); return; }
  st.busy = true; st.asked[k] = true; st.last = k;
  var g = st.gen;
  $('next').innerHTML = ''; observeCard();
  var t = document.createElement('div'); t.className = 'turn'; t.id = 'turn-' + k;
  t.innerHTML = '<div class="ask"><div>' + esc(askLabel(s)) + '</div></div><div class="typing" aria-hidden="true"><i></i><i></i><i></i></div>';
  $('thread').appendChild(t);
  var target = function(){ return docTop(t) - barH() - gap; };
  var P = $('pad');
  P.style.height = window.innerHeight + 'px';
  scrollToY(target());
  setTimeout(function(){
    if (st.gen !== g || st.screen !== 'detail') return;
    var ty = t.querySelector('.typing'); if (ty) ty.remove();
    var a = document.createElement('div'); a.className = 'ans';
    a.innerHTML = '<div class="who">' + esc(c.handle) + ' · ' + esc(s.label) + '</div>' + (s.title ? '<h3 class="h">' + esc(s.title) + '</h3>' : '') + blocks(s);
    t.appendChild(a); keepDots(a);
    counters(a); updateNext();
    P.style.height = '0px';
    var need = target() + window.innerHeight - document.documentElement.scrollHeight;
    P.style.height = Math.max(0, Math.ceil(need)) + 'px';
    scrollToY(target());
    setTimeout(function(){ if (st.gen !== g) return; st.busy = false; spy(); updateBar(); }, 600);
  }, 500);
}
/* 현재 읽는 답변에 맞춰 키워드 탭 표시 */
function spy(){
  if (st.screen !== 'detail') return;
  var y = window.scrollY + barH() + window.innerHeight * 0.25, cur = -1;
  [].forEach.call(document.querySelectorAll('#thread .turn'), function(t){ if (docTop(t) <= y) cur = +t.id.split('-')[1]; });
  [].forEach.call($('chips').children, function(b){ b.classList.toggle('on', +b.getAttribute('data-k') === cur); });
}
var spyRaf = 0;
addEventListener('scroll', function(){ if (!spyRaf) spyRaf = requestAnimationFrame(function(){ spyRaf = 0; spy(); }); }, { passive:true });

/* 다음 질문 고정 바: 인라인 카드가 화면(상단 바 아래 ~ 키워드 탭 위)에 다 보이지 않으면 표시 */
var io = null, cardIn = false, ioKey = '';
function makeIO(){
  if (!('IntersectionObserver' in window)) return;
  var key = barH() + ':' + chipsH();
  if (io && key === ioKey) return;
  ioKey = key;
  if (io) io.disconnect();
  io = new IntersectionObserver(function(es){
    es.forEach(function(e){ cardIn = e.isIntersecting && e.intersectionRatio >= 0.98; });
    updateBar();
  }, { rootMargin: '-' + barH() + 'px 0px -' + chipsH() + 'px 0px', threshold: [0, 0.25, 0.5, 0.75, 0.98, 1] });
  observeCard();
}
function observeCard(){
  cardIn = false;
  if (io){ io.disconnect(); var b = document.querySelector('#next .ghost button'); if (b) io.observe(b); }
  updateBar();
}
function updateBar(){
  var nx = $('next'), gb = nx.querySelector('.ghost button'), nb = $('nbar');
  var hidden = nx.classList.contains('rv') && !nx.classList.contains('on');
  var on = !!(gb && !cardIn && !st.busy && st.screen === 'detail' && !hidden);
  if (on){
    var sm = gb.querySelector('small'), em = gb.querySelector('em');
    $('nbarK').textContent = sm ? sm.textContent : 'next_question';
    $('nbarT').textContent = em ? em.textContent : '';
  }
  nb.classList.toggle('on', on);
  nx.classList.toggle('dup', on);   /* 고정 바가 떠 있는 동안 화면 아래쪽에 반쯤 걸린 인라인 카드는 숨김(중복 방지) */
  nb.setAttribute('aria-hidden', on ? 'false' : 'true');
  nb.tabIndex = on ? 0 : -1;
}
$('nbar').addEventListener('click', function(){ var gb = document.querySelector('#next .ghost button'); if (gb && !st.busy) gb.click(); });
$('next').addEventListener('click', function(e){
  var g = e.target.closest('.ghost button'); if (!g) return;
  if (g.getAttribute('data-home')){ if (!st.busy) goHome(); }
  else ask(+g.getAttribute('data-k'));
});
$('bAll').addEventListener('click', goHome);

function blocks(sec){
  return sec.blocks.map(function(b){
    if (b.t === 'p') return '<p class="p">' + b.html + '</p>';
    if (b.t === 'note') return '<p class="note">' + b.html + '</p>';
    if (b.t === 'quote') return '<h3 class="h s">' + esc(b.text) + '</h3>';
    if (b.t === 'sub') return '<div class="subh">' + (b.text === 'MARKET PROOF' ? 'market_proof' : esc(b.text)) + '</div>';
    if (b.t === 'targets') return '<div class="tgts">' + b.items.map(function(it, k){
      return '<div class="tgt"><div class="tn">target_' + pad(k + 1) + '</div><div class="tk">' + esc(it.k) + '</div>' +
        (it.tags ? '<div class="tt">' + it.tags.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' : '') +
        '<div class="td">' + esc(it.d) + '</div></div>';
    }).join('') + '</div>';
    if (b.t === 'list') return '<ul class="lst">' + b.items.map(function(it, k){ return '<li><span class="m">' + pad(k + 1) + '</span><div>' + it + '</div></li>'; }).join('') + '</ul>';
    if (b.t === 'stats') return '<div class="stats">' + b.items.map(function(it){
      if (it.value) return '<div class="stat"><div class="v">' + countMarkup(it.value) + '</div><div class="l">' + it.label + '</div></div>';
      return '<div class="stat"><div class="bt">' + esc(it.title) + '</div><ul>' + it.list.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul></div>';
    }).join('') + '</div>';
    if (b.t === 'steps') return '<div class="steps">' + b.items.map(function(s, k){
      return '<div class="step"><span class="sn">step_' + pad(k + 1) + '</span><div><div class="st">' + esc(s.title.replace(/^Step\s*\d+\s*\|\s*/i, '')) + '</div>' + (s.body ? '<div class="sb">' + s.body + '</div>' : '') + '</div></div>';
    }).join('') + '</div>';
    if (b.t === 'mentor') return '<div class="mentor"><div class="mh"><span class="ph">' + imgTag(b.photo, '', 0, b.name, true) + '</span><div><div class="mn">' + esc(b.name) + '</div><div class="mr">mentor_</div></div></div>' +
      (b.quote ? '<div class="q">' + esc(b.quote) + '</div>' : '') +
      '<ul>' + b.career.map(function(x){ var m = x.match(/^(현|전)\)\s*(.*)$/); return m ? '<li><span>' + m[1] + '</span>' + m[2] + '</li>' : '<li>' + x + '</li>'; }).join('') + '</ul></div>';
    return '';
  }).join('');
}
function countMarkup(v){ if (/~/.test(v)) return esc(v); return esc(v).replace(/(\d[\d,]*(?:\.\d+)?)/, function(m){ return '<span class="num" data-n="' + m + '">' + m + '</span>'; }); }
function counters(root){
  if (RM.matches) return;
  [].forEach.call(root.querySelectorAll('.num[data-n]'), function(el){
    var raw = el.getAttribute('data-n'), dec = (raw.split('.')[1] || '').length, tgt = parseFloat(raw.replace(/,/g, '')), cm = raw.indexOf(',') > -1, t0 = performance.now();
    (function f(now){ var p = Math.min(1, (now - t0) / 1000), v = tgt * (1 - Math.pow(1 - p, 3)), s = v.toFixed(dec);
      if (cm) s = Number(s).toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec });
      el.textContent = p < 1 ? s : raw; if (p < 1) requestAnimationFrame(f); })(t0);
  });
}

/* 토스트 */
var tT;
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(function(){ t.classList.remove('on'); }, 2200); }

/* 화면 크기 변화: 캔버스 재계산, 관찰 영역 재설정 */
var rzT;
addEventListener('resize', function(){ clearTimeout(rzT); rzT = setTimeout(function(){ if (st.screen === 'home' && !HT.running()) HT.redraw(); makeIO(); spy(); }, 150); });

/* 시작: #home, #c0~#c6 (#c3a5 = 해당 기업 5번 섹션까지 열기) */
var h0 = location.hash || '';
show('home');
if (/^#c\d+(a\d+)?$/.test(h0) && +h0.slice(2).split('a')[0] < N){
  history.replaceState({ home:1 }, '', '#home');
  history.pushState({ c:+h0.slice(2).split('a')[0] }, '', h0);
  route(h0);
}
})();
</script>
</body>
</html>
