<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>d.day 부스 키오스크</title>
<style>
@font-face{font-family:"SUITK";src:url(data:font/woff2;base64,__FONT_SUIT__) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"ChivoMonoK";src:url(data:font/woff2;base64,__FONT_MONO__) format("woff2");font-weight:100 900;font-display:block}
/*
  설치 기준: 55" 세로(685x1215mm), 화면 하단 바닥에서 700mm, 상단 1915mm
  1080x1920px -> 1cm = 15.8px.  y(px) = (191.5 - 높이cm) x 15.8
  - 보는 존  y 0~680   (191~148cm) : 타이틀바, 원페이저, 모바일 QR(눈높이)
  - 손 존    y 680~1530 (148~95cm) : 질문 리스트, 후속 질문, 액션
  - 낮은 존  y 1530~    (95~70cm)  : 보조 이동, 푸터
*/
#stage{
  --bg:#1b1615; --raise:#241e1d; --press:#2e2726; --bubble:#2c2524;
  --line:#3c3838; --line2:#5e5a58; --rule:#72706f;
  --text:#ffffff; --body:#d9d3ce; --sub:#a39d98; --dim:#77716d;
  --lime:#c8db99; --lime-ink:#1b1615;
  --sans:"SUITK","SUIT",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"ChivoMonoK","Chivo Mono",ui-monospace,Menlo,monospace;
  /* 29CM 기준 자간/행간 */
  --ls-display:-0.035em; --ls-head:-0.025em; --ls-body:-0.01em;
  --lh-display:1.12; --lh-head:1.36; --lh-body:1.78;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;border-radius:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-font-smoothing:antialiased}
body.hide-cursor,body.hide-cursor *{cursor:none!important}
img{-webkit-user-drag:none;pointer-events:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:left}
b{font-weight:700}
.mono{font-family:var(--mono);letter-spacing:0}

#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:50% 50%;background:var(--bg);color:var(--text);overflow:hidden;font-family:var(--sans);font-weight:400;letter-spacing:var(--ls-body)}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
.screen.on{opacity:1;visibility:visible;transition:opacity .3s ease}

/* 타이틀바 (벽면 카드 상단과 동일한 구조) */
.bar{position:absolute;left:0;right:0;top:0;height:104px;border-bottom:1.5px solid var(--rule);display:flex;align-items:center;gap:22px;padding:0 48px;color:var(--sub);z-index:5;background:var(--bg)}
.bar .ico{display:flex;gap:18px;color:var(--dim)}
.bar .ico svg{width:30px;height:30px}
.bar .t{font-family:var(--mono);font-size:25px;font-weight:600;color:#bdb7b2}
.bar .t .ko{font-family:var(--sans);font-weight:700;color:#fff;letter-spacing:var(--ls-head);margin:0 4px}
.bar .r{margin-left:auto;font-family:var(--mono);font-size:22px;font-weight:500;color:var(--dim)}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ============ HOME ============ */
#home > canvas{position:absolute;left:0;top:0;z-index:0}
#home > .wash{position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(27,22,21,.86) 0%,rgba(27,22,21,.5) 55%,rgba(27,22,21,.2) 100%)}
#home > *:not(canvas):not(.wash){z-index:1}
.hero{position:absolute;left:0;right:0;top:104px;height:536px}
.hero .in{position:absolute;left:56px;top:56px;right:56px}
.hero .k{font-family:var(--mono);font-size:23px;font-weight:600;color:#ffffff}
.hero .lead{margin-top:46px;font-size:90px;font-weight:700;line-height:1.18;letter-spacing:-0.045em}
.hero .lead .hl{color:var(--lime)}
.hero .st{margin-top:34px;font-family:var(--mono);font-size:22px;font-weight:500;color:var(--sub);line-height:1.6}
.hero .st i{display:inline-block;width:12px;height:12px;background:#fff;border-radius:50%;margin-right:12px;vertical-align:1px}
.mq{position:absolute;right:56px;top:286px;width:160px;text-align:left}
.mq .q{width:160px;height:160px;background:#fff;padding:9px}
.mq .q svg{width:100%;height:100%;display:block}
.mq .c{display:block;width:100%;background:#000;color:#fff;text-align:center;font-size:20px;font-weight:600;line-height:1.4;padding:9px 0;white-space:nowrap}

.list{position:absolute;left:0;right:0;top:640px;border-top:1.5px solid var(--rule)}
.row{background:rgba(27,22,21,.8)}
.row{position:relative;display:flex;align-items:center;gap:28px;width:100%;height:138px;padding:0 48px;border-bottom:1.5px solid var(--line);transition:background .12s}
.row:active{background:rgba(46,39,38,.92)}
.row .n{flex:none;width:86px;font-family:var(--mono);font-size:23px;font-weight:600;color:var(--sub)}
.row .tx{flex:1;min-width:0}
.row .lgw{display:flex;align-items:center;height:42px}
.row .lg{height:30px;width:auto;max-width:240px;object-fit:contain;object-position:left center}
.row .qq{margin-top:10px;font-size:32px;font-weight:600;line-height:1.3;letter-spacing:var(--ls-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .go{flex:none;width:40px;height:40px;color:var(--sub)}

.composer{position:absolute;left:48px;right:48px;top:1628px;height:104px;border:1.5px dashed var(--line2);background:rgba(27,22,21,.74);display:flex;align-items:center;padding:0 30px;gap:16px}
.composer .ph{flex:1;font-size:27px;color:var(--sub);letter-spacing:var(--ls-body)}
.composer .ph u{text-decoration:none;color:#fff}
.composer .ret{width:40px;height:40px;color:var(--sub)}
.tools{position:absolute;left:66px;top:1752px;display:flex;gap:28px;color:var(--dim)}
.tools svg{width:28px;height:28px}
.foot > span{background:rgba(27,22,21,.85);padding:4px 8px}
.foot{position:absolute;left:40px;right:40px;bottom:36px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:20px;font-weight:500;color:var(--dim);line-height:1.5}
.foot i{display:inline-block;width:10px;height:10px;background:#fff;border-radius:50%;margin-right:10px;vertical-align:1px}

/* ============ DETAIL (대화) ============ */
.panel{position:absolute;left:0;right:0;top:104px;height:1140px;overflow-y:auto;overflow-x:hidden;padding:60px 56px 90px;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.topfade{position:absolute;left:0;right:0;top:104px;height:210px;background:linear-gradient(180deg,var(--bg) 85%,rgba(27,22,21,0));pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
.topfade.on{opacity:1}
.pfade{position:absolute;left:0;right:0;top:1204px;height:40px;background:linear-gradient(180deg,rgba(27,22,21,0),var(--bg));pointer-events:none;opacity:0;transition:opacity .25s}
.nbar{position:absolute;right:48px;top:1150px;max-width:760px;display:flex;align-items:center;gap:24px;padding:14px 22px 14px 28px;background:var(--bg);border:1.5px solid var(--lime);box-shadow:0 -24px 30px 6px var(--bg);color:var(--text);opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .25s,transform .25s,visibility 0s linear .25s;z-index:3}
.nbar.on{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s}
.nbar:active{background:var(--press)}
.nbar small{display:block;font-family:var(--mono);font-size:17px;font-weight:600;color:var(--lime)}
.nbar em{display:block;font-style:normal;font-size:25px;font-weight:500;line-height:1.4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:640px}
.nbar svg{flex:none;width:32px;height:32px;color:var(--lime);animation:press 2.4s ease-in-out infinite}
.more{position:absolute;left:48px;right:48px;top:1244px;height:48px;border-top:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;pointer-events:none}
.more span{font-family:var(--mono);font-size:19px;font-weight:600;color:transparent;background:linear-gradient(90deg,#8a847f 0%,#8a847f 38%,#ffffff 50%,#8a847f 62%,#8a847f 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;opacity:0;transition:opacity .25s}
.more.on span{animation:shine 2.6s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
.more.on span,.more.on ~ .pfade{opacity:1}
.more span{display:block;transform:translateY(-6px) scaleY(.2);transform-origin:50% 0;transition:opacity .25s ease,transform .3s ease}
.more.on span{transform:none}
.sig{position:absolute;left:48px;right:48px;bottom:64px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.sig .k{font-family:var(--mono);font-size:18px;font-weight:600;color:#fff}
.sig .w{margin-top:10px;color:var(--lime);line-height:0}
.sig .w .wm{width:300px;height:auto;display:block}
.sig .r{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--sub);line-height:1.6;text-align:right;padding-bottom:4px}
.sig .r i{display:inline-block;width:10px;height:10px;background:#fff;border-radius:50%;margin-right:10px;vertical-align:1px}

.d-logo{height:62px;width:auto;max-width:440px;object-fit:contain;object-position:left center}
.d-q{margin-top:52px;min-height:104px;font-size:37px;font-weight:800;line-height:1.4;white-space:nowrap;letter-spacing:var(--ls-display);color:var(--lime)}
.d-q .cur{display:inline-block;width:.5em;height:4px;margin-left:4px;background:var(--lime);vertical-align:baseline;animation:blink 1s steps(1) infinite}
.rv{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease}
.rv.on{opacity:1;transform:none}
.d-intro .ln{display:block}
.d-intro{margin-top:40px;font-size:30px;font-weight:500;line-height:var(--lh-body);letter-spacing:var(--ls-body);color:var(--text);word-break:keep-all}
.d-p{margin-top:26px;font-size:27px;font-weight:400;line-height:var(--lh-body);letter-spacing:var(--ls-body);color:var(--body);word-break:keep-all}
.d-core{margin-top:40px;padding-top:22px;border-top:1.5px solid var(--line);display:flex;gap:20px;font-size:23px;line-height:1.6;color:var(--sub);word-break:keep-all}
.d-core .mono{flex:none;font-size:20px;font-weight:600;color:var(--lime);padding-top:3px}

.turn{margin-top:72px}
.ask{display:flex;justify-content:flex-end}
.ask div{max-width:78%;background:var(--bubble);padding:24px 30px;font-size:28px;font-weight:500;line-height:1.5;letter-spacing:var(--ls-body)}
.turn .ask{animation:up .4s ease both}
.turn .ans{margin-top:40px;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.next{margin-top:72px;padding-bottom:140px}
.next .ghost{display:flex;justify-content:flex-end}
.next .ghost button{max-width:78%;display:flex;align-items:center;gap:26px;border:1.5px solid var(--rule);padding:22px 26px 22px 30px;font-size:28px;font-weight:500;line-height:1.5;color:var(--text);transition:background .12s}
.next .ghost button{animation:breathe 2.4s ease-in-out infinite}
.next .ghost button svg{animation:press 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{border-color:var(--rule)}50%{border-color:var(--lime);box-shadow:0 0 0 4px rgba(200,219,153,.08)}}
@keyframes press{0%,60%,100%{transform:none}75%{transform:translate(-4px,3px) scale(.92)}}
.next .ghost button:active{background:var(--press)}
.next .ghost button svg{flex:none;width:36px;height:36px;color:var(--lime)}
.next .ghost .gl{display:block;width:auto;max-width:300px;object-fit:contain;object-position:left center;margin:8px 0 10px}
.next .ghost em{display:block;font-style:normal}
.next .ghost small{display:block;font-family:var(--mono);font-size:18px;font-weight:600;color:var(--lime);margin-bottom:6px}
.next .pull{margin-top:28px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:23px;font-weight:600;color:var(--sub)}
.next .pull svg{width:28px;height:28px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.next .end{border-top:1.5px solid var(--rule);padding-top:30px;font-size:27px;line-height:1.6;color:var(--body);word-break:keep-all}
.next .end b{color:var(--lime);font-weight:600}
.dnav .all.pulse{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(200,219,153,.25)}}
.x{}
@media (prefers-reduced-motion:reduce){.more.on span,.next .ghost button,.next .ghost button svg{animation:none}}
@media (prefers-reduced-motion:reduce){.turn .ask,.turn .ans,.next .pull svg,.dnav .all.pulse{animation:none}}
.typing{margin-top:40px;display:flex;gap:10px}
.typing i{width:12px;height:12px;background:var(--sub);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.who{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--lime)}
.h{margin-top:16px;font-size:38px;font-weight:600;line-height:var(--lh-head);letter-spacing:var(--ls-head);word-break:keep-all}
.h.s{font-size:32px;margin-top:44px}
.h,.mentor .q,.step .st,.next .ghost em{text-wrap:balance}
.p,.d-p,.lst li,.step .sb,.stat .l,.note,.mentor li,.ask div{text-wrap:pretty}
.p{margin-top:24px;font-size:27px;line-height:var(--lh-body);color:var(--body);word-break:keep-all}
.p b{color:#fff;font-weight:600}
.note{margin-top:14px;font-size:21px;line-height:1.6;color:var(--sub);word-break:keep-all}
.note b{color:var(--body);font-weight:600}
.subh{margin-top:44px;font-family:var(--mono);font-size:20px;font-weight:600;color:var(--sub)}
.lst{list-style:none;margin-top:18px;border-top:1.5px solid var(--line)}
.lst li{display:flex;gap:22px;padding:22px 0;border-bottom:1.5px solid var(--line);font-size:26px;line-height:1.6;color:var(--body);word-break:keep-all}
.lst li b{color:#fff;font-weight:600}
.lst li .m{flex:none;width:44px;font-family:var(--mono);font-size:20px;font-weight:600;color:var(--lime);padding-top:5px}
.tgts{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid var(--rule)}
.tgts.one{grid-template-columns:1fr}
.tgt{padding:26px 26px 28px 0;border-bottom:1.5px solid var(--line)}
.tgts:not(.one) .tgt:nth-child(2n){padding-left:26px;border-left:1.5px solid var(--line)}
.tgt .tn{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--lime)}
.tgt .tk{margin-top:12px;font-size:40px;font-weight:700;line-height:1.25;letter-spacing:-0.035em;word-break:keep-all;text-wrap:balance}
.tgt .tt{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.tgt .tt span{font-size:19px;font-weight:600;color:var(--body);background:var(--bubble);padding:5px 12px}
.tgt .td{margin-top:16px;font-size:22px;line-height:1.6;color:var(--sub);word-break:keep-all;text-wrap:pretty}
.stats{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid var(--rule)}
.stats.one{grid-template-columns:1fr}
.stat{padding:26px 26px 24px 0;border-bottom:1.5px solid var(--line)}
.stats:not(.one) .stat:nth-child(2n){padding-left:26px;border-left:1.5px solid var(--line)}
.stat .v{font-size:56px;font-weight:700;letter-spacing:-0.04em;line-height:1.1;word-break:keep-all}
.stat .v .num{color:var(--lime)}
.stat .l{margin-top:12px;font-size:21px;line-height:1.6;color:var(--sub);word-break:keep-all}
.stat .l b{color:var(--body);font-weight:600}
.stat .bt{font-size:23px;font-weight:600}
.stat ul{list-style:none;margin-top:8px}
.stat li{font-size:21px;line-height:1.55;color:var(--sub);padding:5px 0;word-break:keep-all}
.steps{margin-top:30px;border-top:1.5px solid var(--rule)}
.step{display:flex;gap:26px;padding:28px 0;border-bottom:1.5px solid var(--line)}
.step .sn{flex:none;width:100px;font-family:var(--mono);font-size:20px;font-weight:600;color:var(--lime);padding-top:7px}
.step .st{font-size:29px;font-weight:600;line-height:1.42;letter-spacing:var(--ls-head);word-break:keep-all}
.step .sb{margin-top:10px;font-size:24px;line-height:1.72;color:var(--body);word-break:keep-all}
.mentor{margin-top:30px;border-top:1.5px solid var(--rule);padding-top:30px}
.mentor + .mentor{margin-top:44px}
.mentor .mh{display:flex;gap:28px;align-items:flex-end}
.mentor .ph{width:150px;height:150px;flex:none;overflow:hidden;background:#ccc}
.mentor .ph img{width:100%;height:100%;object-fit:cover}
.mentor .mn{font-size:44px;font-weight:700;letter-spacing:-0.03em}
.mentor .mr{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--sub);margin-top:6px}
.mentor .q{margin-top:28px;font-size:30px;font-weight:600;line-height:1.45;letter-spacing:var(--ls-head);word-break:keep-all}
.mentor ul{list-style:none;margin-top:16px}
.mentor li{display:flex;gap:16px;font-size:24px;line-height:1.6;color:var(--body);padding:7px 0}
.mentor li span{flex:none;width:36px;font-weight:600;color:var(--sub)}
.contact{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cbox{display:block;border:1.5px solid var(--rule);padding:24px;width:100%}
.cbox:active{background:var(--press)}
.cbox .q{width:100%;aspect-ratio:1;background:#fff;padding:12px}
.cbox .q svg{width:100%;height:100%;display:block}
.cbox .ck{display:block;margin-top:18px;font-family:var(--mono);font-size:19px;font-weight:600;color:var(--lime)}
.cbox .cv{display:block;margin-top:6px;font-size:24px;font-weight:600;word-break:break-all;line-height:1.4}

.chips{position:absolute;left:48px;right:48px;top:1298px;height:96px;display:flex;background:#241e1d;padding:0 6px}
.chip{position:relative;flex:1 1 auto;height:96px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.01em;color:#8a847f;white-space:nowrap;transition:color .15s,background .15s}
.chip:after{content:"";position:absolute;left:50%;bottom:16px;width:0;height:2px;background:var(--lime);transition:width .2s,left .2s}
.chip:active{color:var(--body);background:#2e2726}
.chip.on{color:var(--lime)}
.chip.on:after{left:calc(50% - 22px);width:44px}
.dbox{position:absolute;left:48px;right:48px;top:1408px;border-top:0;height:84px;border-top:1.5px solid var(--line);display:flex;align-items:center;gap:44px}
.dbox .ph{font-family:var(--mono);font-size:19px;font-weight:600;color:#7f7975;margin-right:auto}
.act{height:84px;display:flex;align-items:center;gap:12px;font-size:25px;font-weight:500;color:#fff;letter-spacing:var(--ls-body)}
.act:active{color:var(--lime)}
.act svg{width:30px;height:30px}
.act.hide{display:none}
.dnav{position:absolute;left:48px;right:48px;top:1510px;height:100px;display:flex}
.dnav button{display:flex;align-items:center;gap:12px;padding:0 22px;font-size:24px;font-weight:600;color:var(--body);border:1.5px solid var(--line)}
.dnav button:active{background:var(--press)}
.dnav button svg{width:26px;height:26px;flex:none}
.dnav .all{flex:1;justify-content:center;gap:14px;background:var(--bubble);border-color:var(--bubble);color:#fff;font-size:27px;font-weight:600}
.dnav .all:active{background:#3a3231}
.dnav .all svg{width:34px;height:34px;color:var(--lime)}
.dnav .all .m{color:var(--sub)}
.dnav .m{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--sub)}
.dnav .pv,.dnav .nx{flex:none;width:250px;padding:0 18px}
.dnav .nx{justify-content:flex-end;text-align:right}
.dnav .lb{display:block;min-width:0}
.dnav .lb .m{display:block;font-size:18px}
.dnav .lb .nl{display:block;margin-top:10px;width:auto;max-width:168px;object-fit:contain;object-position:left center}
.dnav .nx .lb .nl{margin-left:auto;object-position:right center}

/* ============ QR 창 ============ */
.modal{position:absolute;inset:0;z-index:50;visibility:hidden}
.modal.on{visibility:visible}
.modal .dim{position:absolute;inset:0;background:rgba(10,8,8,.78);opacity:0;transition:opacity .25s}
.modal.on .dim{opacity:1}
.win{position:absolute;left:72px;right:72px;top:236px;background:var(--bg);border:1.5px solid var(--rule);opacity:0;transform:translateY(30px);transition:opacity .28s,transform .32s cubic-bezier(.2,.9,.25,1)}
.modal.on .win{opacity:1;transform:none}
.win .wb{height:92px;border-bottom:1.5px solid var(--rule);display:flex;align-items:center;gap:18px;padding:0 36px;font-family:var(--mono);font-size:23px;font-weight:600;color:#bdb7b2}
.win .wb .ico{display:flex;gap:14px;color:var(--dim)}.win .wb .ico svg{width:26px;height:26px}
.win .bd{padding:44px 56px 48px}
.win h2{font-size:48px;font-weight:600;letter-spacing:var(--ls-display);line-height:1.25}
.win .desc{margin-top:14px;font-size:25px;color:var(--sub);line-height:1.6;word-break:keep-all}
.win .qbig{margin:36px auto 0;width:520px;height:520px;background:#fff;padding:24px}
.win .qbig svg{width:100%;height:100%;display:block}
.win .url{margin-top:26px;text-align:center;font-size:28px;font-weight:600;word-break:break-all}
.win .scan{margin-top:8px;text-align:center;font-family:var(--mono);font-size:19px;font-weight:600;color:var(--sub)}
.win .close{margin-top:40px;width:100%;height:118px;border:1.5px solid var(--rule);font-size:30px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:16px}
.win .close:active{background:var(--press)}
.win .close small{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--sub)}

.toast{position:absolute;left:50%;top:1140px;transform:translate(-50%,20px);z-index:40;background:#fff;color:var(--bg);padding:22px 34px;font-size:25px;font-weight:600;opacity:0;transition:all .3s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ ADMIN ============ */
#hot{position:absolute;left:0;bottom:0;width:160px;height:140px;z-index:90}
#admin{position:absolute;inset:0;z-index:100;background:rgba(18,14,13,.97);color:#fff;display:none;padding:80px 64px;overflow:auto;touch-action:pan-y}
#admin.on{display:block}
#admin h3{font-size:40px;font-weight:700}
#admin .info{font-family:var(--mono);font-size:20px;color:var(--sub);margin-top:12px;line-height:1.7}
#admin table{width:100%;margin-top:30px;border-collapse:collapse;font-size:24px}
#admin th,#admin td{padding:16px 8px;border-bottom:1.5px solid var(--line);text-align:right}
#admin th:first-child,#admin td:first-child{text-align:left}
#admin th{font-family:var(--mono);color:var(--sub);font-weight:600;font-size:18px}
#admin .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
#admin .btns button{height:100px;border:1.5px solid var(--rule);font-size:26px;font-weight:600;text-align:center}
#admin .btns button.w{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
#admin .btns button.red{color:#ff8a80}
#guide{position:absolute;inset:0;z-index:80;pointer-events:none;display:none}

#guide .ln{position:absolute;left:0;right:0;border-top:2px dashed rgba(255,80,80,.9)}

    var html = el.innerHTML, lh = parseFloat(getComputedStyle(el).lineHeight) || 40;
    var lines = function(){ return Math.round(el.offsetHeight / lh); };
    var txt = el.textContent, force = el.classList.contains('h') && txt.length >= 24 && /,\s/.test(txt);
    if (lines() < 2 && !force) return;
    var parts = html.split(/(,\s)/), best = null, bestD = 1e9;
    for (var i = 1; i < parts.length; i += 2){
      var a = parts.slice(0, i).join('') + ',', b = parts.slice(i + 1).join('');
      el.innerHTML = a + '<br>' + b;
      if (lines() === 2 && a.length >= 8 && b.length >= 8){ var d = Math.abs(a.length - b.length); if (d < bestD){ bestD = d; best = el.innerHTML; } }
    }
    el.innerHTML = best || html;
  });
}
function countMarkup(v){ if (/~/.test(v)) return esc(v); return esc(v).replace(/(\d[\d,]*(?:\.\d+)?)/, function(m){ return '<span class="num" data-n="' + m + '">' + m + '</span>'; }); }
function counters(root){
  [].forEach.call(root.querySelectorAll('.num[data-n]'), function(el){
    var raw = el.getAttribute('data-n'), dec = (raw.split('.')[1] || '').length, tgt = parseFloat(raw.replace(/,/g,'')), cm = raw.indexOf(',') > -1, t0 = performance.now();
    (function f(now){ var p = Math.min(1,(now-t0)/1000), v = tgt*(1-Math.pow(1-p,3)), s = v.toFixed(dec);
      if (cm) s = Number(s).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
      el.textContent = p < 1 ? s : raw; if (p < 1) requestAnimationFrame(f); })(t0);
  });
}
$('bAll').addEventListener('click', function(){ show('home'); });
$('bWeb').addEventListener('click', openWeb);
$('bMail').addEventListener('click', openMail);
function openWeb(){ var c = DATA[st.ci]; if (!c.home) return; bump(c.id,'web'); openQR({bar:c.qn + ' · ' + c.handle + ' / homepage', title:'홈페이지 방문', desc:'휴대폰 카메라로 스캔하면 ' + esc(c.ko) + ' 홈페이지가 열려요.', data:c.home, label:c.homeLabel || pretty(c.home)}); }
function openMail(){ var c = DATA[st.ci]; if (!c.email) return; bump(c.id,'mail'); openQR({bar:c.qn + ' · ' + c.handle + ' / mail', title:'메일 문의', desc:'스캔하면 받는 사람과 제목이 채워진 메일 작성 화면이 열려요.', data:mailHref(c), label:c.email}); }
$('mobQR').parentNode.addEventListener('click', function(){ openQR({bar:'one-pager / mobile', title:'휴대폰으로 보기', desc:'원페이저 전체를 휴대폰에서 다시 볼 수 있어요.', data:CONFIG.mobileUrl, label:pretty(CONFIG.mobileUrl)}); });

/* QR 창 */
var mT = 0, mL = 0;
function openQR(o){
  $('mBar').textContent = o.bar; $('mTitle').textContent = o.title; $('mDesc').innerHTML = o.desc;
  $('mQR').innerHTML = qrSvg(o.data); $('mUrl').textContent = o.label;
  $('modal').classList.add('on');
  mL = CONFIG.qrAutoClose; $('mCount').textContent = 'auto close ' + mL + 's';
  clearInterval(mT); mT = setInterval(function(){ mL--; $('mCount').textContent = 'auto close ' + mL + 's'; if (mL <= 0) closeModal(); }, 1000);
}
function closeModal(){ clearInterval(mT); $('modal').classList.remove('on'); }
$('mClose').addEventListener('click', closeModal);
$('mDim').addEventListener('click', closeModal);

/* 토스트 / 대기 복귀 */
var tT;
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(function(){ t.classList.remove('on'); }, 2200); }
var last = Date.now(), warned = false;
['pointerdown','touchstart','keydown','wheel'].forEach(function(ev){ document.addEventListener(ev, function(){ last = Date.now(); if (warned){ warned = false; $('toast').classList.remove('on'); } }, {passive:true, capture:true}); });
setInterval(function(){
  var idle = (Date.now() - last)/1000, mo = $('modal').classList.contains('on');
  if (mo || st.screen !== 'detail') return;
  if (idle > CONFIG.idleToHome - 8 && idle < CONFIG.idleToHome && !warned){ warned = true; $('toast').textContent = '잠시 후 처음 화면으로 돌아가요'; $('toast').classList.add('on'); }
  if (idle >= CONFIG.idleToHome){ warned = false; $('toast').classList.remove('on'); show('home'); }
}, 1000);

/* 관리자 */
(function(){
  var taps = [];
  $('hot').addEventListener('pointerdown', function(e){
    e.stopPropagation(); var now = Date.now();
    taps = taps.filter(function(t){ return now - t < 3000; }); taps.push(now);
    if (taps.length >= CONFIG.adminTaps){ taps = []; openAdmin(); }
  });
})();
function buildGuide(){
  var b = CONFIG.mount.bottomCm, t = CONFIG.mount.topCm, k = 1920/(t-b), h = '', y = function(cm){ return (t-cm)*k; };
  h += '<div class="zone" style="top:' + y(148) + 'px;height:' + (y(95)-y(148)) + 'px"></div>';
  for (var cm = Math.ceil(b/10)*10; cm <= t; cm += 10) h += '<div class="ln" style="top:' + y(cm) + 'px"><span>' + cm + 'cm</span></div>';
  $('guide').innerHTML = h;
}
function openAdmin(){
  stats = loadStats();
  var T = {view:0, web:0, mail:0};
  var rows = DATA.map(function(c){ var s = stats[c.id] || {}; T.view += s.view||0; T.web += s.web||0; T.mail += s.mail||0;
    return '<tr><td>' + esc(c.qn + '  ' + c.ko) + '</td><td>' + (s.view||0) + '</td><td>' + (s.web||0) + '</td><td>' + (s.mail||0) + '</td></tr>'; }).join('');
  $('admin').innerHTML = '<h3>관리자 메뉴</h3><div class="info">records ' + N + ' · window ' + innerWidth + 'x' + innerHeight + ' · ' + (navigator.onLine ? 'online' : 'offline (ok)') + '<br>통계는 이 PC 브라우저에만 저장돼요.</div>' +
    '<table><tr><th>COMPANY</th><th>VIEW</th><th>WEB QR</th><th>MAIL QR</th></tr>' + rows + '<tr><td><b>합계</b></td><td><b>' + T.view + '</b></td><td><b>' + T.web + '</b></td><td><b>' + T.mail + '</b></td></tr></table>' +
    '<div class="btns"><button class="w" data-a="close">닫기</button><button data-a="guide">높이 가이드 ' + ($('guide').classList.contains('on') ? '끄기' : '켜기') + '</button><button data-a="fs">전체화면 전환</button><button data-a="reload">새로고침</button><button class="red" data-a="reset">통계 초기화</button></div>';
  $('admin').classList.add('on');
}
$('admin').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return; var a = b.getAttribute('data-a');
  if (a === 'close') $('admin').classList.remove('on');
  if (a === 'guide'){ buildGuide(); $('guide').classList.toggle('on'); $('admin').classList.remove('on'); }
  if (a === 'fs'){ try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch(err){} }
  if (a === 'reload') location.reload();
  if (a === 'reset'){ if (b.getAttribute('data-c')){ stats = {}; try { localStorage.removeItem(SK); } catch(err){} openAdmin(); } else { b.setAttribute('data-c','1'); b.textContent = '한 번 더 누르면 초기화'; } }
});

/* 시작 (#c0, #c0a3 = 3번째 후속질문까지 열기, #guide) */
var hs = (location.hash || '').replace('#',''), m = hs.match(/c(\d+)(?:a(\d+))?/);
if (/guide/.test(hs)){ buildGuide(); $('guide').classList.add('on'); }
if (m){ openCompany(+m[1]); if (m[2] != null) ask(+m[2]); } else show('home');
})();
</script>
